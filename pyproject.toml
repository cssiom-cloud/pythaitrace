[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythaitrace"
version = "2.0.1"
description = "Zero-crash bilingual developer diagnostic CLI tool with responsive Rich terminal output and humanized Thai mental models"
readme = { text = "PyThaiTrace v2.0 - Zero-crash bilingual Python developer diagnostic runner.", content-type = "text/markdown" }
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "PyThaiTrace Team" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Thai",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
pydantic = [
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pydantic>=2.0.0",
]

[project.scripts]
thpy = "pythaitrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pythaitrace = ["rules.json"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
